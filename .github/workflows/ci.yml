name: CI - Build & Push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Extraire le SHA court du commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image Docker
        run: docker build -t nettorche/cv-analyzer:${{ steps.vars.outputs.sha_short }} .

      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nettorche/cv-analyzer:${{ steps.vars.outputs.sha_short }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Push de l'image sur Docker Hub
        run: docker push nettorche/cv-analyzer:${{ steps.vars.outputs.sha_short }}